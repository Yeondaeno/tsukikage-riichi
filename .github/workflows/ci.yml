name: Tsukikage development checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsukikage-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsukikage-validation:
    name: tsukikage-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source, tracked paths, rules, matches and static build
        run: python tools/dev.py check
